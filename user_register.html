<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
        <div class="container">
            <form  id="form" class="needs-validation" novalidate>
                <!-- <input type="text" class="" name="user_name" placeholder="Full name"><br>
                <input type="email" name="user_email" placeholder="Email ID"> <br>
                <input type="text" name="user_password" placeholder="Password"><br>
                <input type="text" name="re-password" placeholder="Retype password"><br> -->
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="fullname-input" placeholder="FullName" >
                    <label for="fullname-input">Full Name</label>
                    <div id="validate-fullname" >
                    </div>
                    
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email-input" placeholder="name@gmail.com" >
                    <label for="email-input">Email address</label>
                    <div id="validate-email" >
                    </div>
                    </div>
                    
                <div class="form-floating">
                    <input type="password" class="form-control" id="password-input" placeholder="Password" >
                    <label for="password-input">Password</label>
                    <div id="validate-password" >
                    </div>
                </div>
                
                <div class="form-floating mt-2 mb-4">
                    <input type="password" class="form-control" id="retypePassword-input" placeholder="Password" >
                    <label for="retypePassword-input">Retype Password</label>
                    <div id="validate-retypepassword" >
                    </div>
                </div>
                
                <div id="register-bottom">
                    <span><p><b>Already have an account! </b></p><a href="user_login.html">Sign In </a> &nbsp;<button type='submit' class="btn btn-primary" id="create-btn" >Create </button></span>
                </div>
            </form>
        </div>
        <script src="script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
